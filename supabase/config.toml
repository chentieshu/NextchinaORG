project_id = "nextchina"

[auth]
site_url = "https://chinateam.org"
enable_manual_linking = true
minimum_password_length = 12
additional_redirect_urls = [
  "https://chinateam.org/zh-CN/auth/callback/",
  "https://chinateam.org/en/auth/callback/",
  "https://chinateam.org/ja/auth/callback/",
  "https://chinateam.org/es/auth/callback/",
  "https://chinateam.org/zh-TW/auth/callback/",
  "https://nextchina.org/zh-CN/auth/callback/",
  "https://nextchina.org/en/auth/callback/",
  "https://nextchina.org/ja/auth/callback/",
  "https://nextchina.org/es/auth/callback/",
  "https://nextchina.org/zh-TW/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/zh-CN/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/en/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/ja/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/es/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/zh-TW/auth/callback/"
]

[auth.email]
otp_length = 8
otp_expiry = 600
max_frequency = "1m"

[auth.email.template.magic_link]
subject = "ChinaTeam · 邮箱验证码 / Email verification"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
