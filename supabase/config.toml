project_id = "nextchina"

[auth]
site_url = "https://pg520.app"
enable_manual_linking = true
minimum_password_length = 12
additional_redirect_urls = [
  "https://pg520.app/zh-CN/auth/callback/",
  "https://pg520.app/en/auth/callback/",
  "https://pg520.app/ja/auth/callback/",
  "https://pg520.app/es/auth/callback/",
  "https://pg520.app/zh-TW/auth/callback/",
  "https://www.pg520.app/zh-CN/auth/callback/",
  "https://www.pg520.app/en/auth/callback/",
  "https://www.pg520.app/ja/auth/callback/",
  "https://www.pg520.app/es/auth/callback/",
  "https://www.pg520.app/zh-TW/auth/callback/",
  "https://omniremix.pages.dev/zh-CN/auth/callback/",
  "https://omniremix.pages.dev/en/auth/callback/",
  "https://omniremix.pages.dev/ja/auth/callback/",
  "https://omniremix.pages.dev/es/auth/callback/",
  "https://omniremix.pages.dev/zh-TW/auth/callback/",
  "https://teamcn-admin.pages.dev/zh-CN/auth/callback/",
  "https://teamcn-admin.pages.dev/en/auth/callback/",
  "https://teamcn-admin.pages.dev/ja/auth/callback/",
  "https://teamcn-admin.pages.dev/es/auth/callback/",
  "https://teamcn-admin.pages.dev/zh-TW/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/zh-CN/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/en/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/ja/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/es/auth/callback/",
  "https://omniremix.chentieshu520.chatgpt.site/zh-TW/auth/callback/"
]

[auth.email]
otp_length = 8
otp_expiry = 600
max_frequency = "1m"

[auth.email.template.magic_link]
subject = "Teamcn · 邮箱验证码 / Email verification"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.email.template.confirmation]
subject = "Teamcn · 确认注册 / Confirm signup"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.invite]
subject = "Teamcn · 账户邀请 / Your invitation"
content_path = "./supabase/templates/invite-user.html"

[auth.email.template.email_change]
subject = "Teamcn · 确认更换邮箱 / Confirm email change"
content_path = "./supabase/templates/change-email.html"

[auth.email.template.recovery]
subject = "Teamcn · 重置密码 / Reset password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.reauthentication]
subject = "Teamcn · 身份验证码 / Verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Teamcn · 密码已更改 / Password changed"
content_path = "./supabase/templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Teamcn · 邮箱已更改 / Email changed"
content_path = "./supabase/templates/email-changed.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "Teamcn · 电话已更改 / Phone changed"
content_path = "./supabase/templates/phone-changed.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "Teamcn · 登录方式已关联 / Sign-in linked"
content_path = "./supabase/templates/identity-linked.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "Teamcn · 登录方式已移除 / Sign-in removed"
content_path = "./supabase/templates/identity-unlinked.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Teamcn · MFA 已添加 / Verification added"
content_path = "./supabase/templates/mfa-added.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Teamcn · MFA 已移除 / Verification removed"
content_path = "./supabase/templates/mfa-removed.html"
